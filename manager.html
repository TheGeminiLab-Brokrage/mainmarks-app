<!doctype html>
<html lang="en" data-t-title="Main Marks — Manager view">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Main Marks — Manager view</title>
<meta name="theme-color" content="#0c0907">
<meta name="robots" content="noindex">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/manager.css?v=143">
</head>
<body>

<!-- THE SALES MANAGER VIEW, in the look Muhanad chose on 2026-10-06 (Ember).
     One page, five tabs on a bottom bar. Everything on it is drawn by
     js/manager.js from the book js/manager-book.js hands it; the brief
     (Moray App Brief, section 7c) is the specification. -->
<div class="glow" aria-hidden="true"></div>

<!-- THE PULSE ON TEAM PULSE (build 143; Muhanad, 2026-10-12: "when i click on the team pulse from the quich
     offer the team pulse animation doesnot show so add it as well"). The drawing of my.html, with this
     page's name under it: the half-dial sweeps in, the heartbeat draws through it, then Team Pulse comes
     up. It is for the way in from the sales app, where the heartbeat button is. From "Lead or sell?" he
     has just seen this drawing on the card he tapped, and on a reload or the back button he is already
     here, so the script below takes it away in those cases, and a person who asked for less motion never
     sees it (css/manager.css). In the page itself and inline for the reason given in my.html: it has to
     be on the glass in the first frame. js/manager.js runs it. -->
<div class="pulse-in" id="pulseIn" aria-hidden="true">
  <div class="pi-wrap">
    <div class="pi-halo"></div>
    <svg class="pi-dial" viewBox="0 0 240 128">
      <path class="g-track" d="M 20 116 A 100 100 0 0 1 220 116"/>
      <path class="g-arc g-a" style="--k:0" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="124.8 629" stroke-dashoffset="0"/>
      <path class="g-arc g-q" style="--k:1" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="21.1 629" stroke-dashoffset="-128.8"/>
      <path class="g-arc g-i" style="--k:2" d="M 20 116 A 100 100 0 0 1 220 116" stroke-dasharray="77.7 629" stroke-dashoffset="-153.9"/>
      <path class="g-beat" pathLength="100" d="M 62 100 h 34 l 9 -26 l 13 44 l 11 -32 l 7 14 h 42"/>
    </svg>
    <p class="pi-label" data-t="Team Pulse">Team Pulse</p>
  </div>
</div>
<script>
(function () {
  var from = '', nav = (window.performance && performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
  try { var u = new URL(document.referrer); if (u.origin === location.origin) from = u.pathname; } catch (e) { /* no page before this one */ }
  if (!from || /(^|\/)(start|login|manager)\.html$/.test(from) || nav.type === 'reload' || nav.type === 'back_forward') document.getElementById('pulseIn').hidden = true;
}());
</script>

<main class="scr" id="scr"></main>
<button class="fab" id="fab" type="button" hidden aria-label="Record an orientation, a workshop, a meeting, a reservation, a contract or a cancellation" data-t-aria="Record an orientation, a workshop, a meeting, a reservation, a contract or a cancellation"></button>
<nav class="tab" id="tab" aria-label="Sections" data-t-aria="Sections" hidden></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" data-t-aria="Details"></div>
<div class="toast" id="toast" role="status"></div>

<script src="js/config.js?v=143"></script>
<script src="js/i18n.js?v=143"></script>
<script src="js/auth.js?v=143"></script>
<script src="js/inventory.js?v=143"></script>
<script src="js/xlsx.js?v=143"></script>
<script src="js/manager-book.js?v=143"></script>
<script src="js/manager.js?v=143"></script>
</body>
</html>
