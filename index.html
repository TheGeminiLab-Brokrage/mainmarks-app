<!-- ACCESS GRANTED, arriving half. Identical markup to login.html — see
     css/styles.css, "the crossing".

     IT IS FIRST IN THE BODY, AND THE SCRIPT BELOW IT IS INLINE AND
     SYNCHRONOUS, ON PURPOSE. Both have to be settled before anything
     else paints. From app.js, at the foot of the page, the project
     list would show at full brightness for a frame before the overlay
     covered it — a white flash in the middle of the transition, which
     is the one thing it cannot survive. The overlay is fixed, so
     sitting first costs the layout nothing. -->
<div class="xfade" id="xfade" aria-hidden="true">
  <span class="xf-line xf-l1 from-l"></span>
  <span class="xf-line xf-l2 from-r"></span>
  <span class="xf-line xf-l3 from-l"></span>
  <span class="xf-line xf-l4 from-r"></span>
  <div class="xf-copy">
    <p class="xf-granted" data-t="Access granted">Access granted</p>
    <p class="xf-select" data-t="Select a project">Select a project</p>
    <span class="xf-rule"></span>
  </div>
</div>
<script>
/* Did we arrive through the sign-in transition? The classes are put on
   HERE rather than by a rule keyed off the <html> flag, because a
   first-paint rule would have to out-rank the rules that later animate
   the overlay away — and losing that specificity race means an overlay
   that never lifts. The element carries its own state instead.

   The key is read once and removed, and anything older than four
   seconds is ignored, so a stale flag can never black out a page
   somebody opened on its own. */
(function () {
  try {
    var t = sessionStorage.getItem('mm.enter');
    sessionStorage.removeItem('mm.enter');
    if (!t || (Date.now() - Number(t)) >= 4000) return;
    document.documentElement.className += ' is-entering';
    /* This page is being UNCOVERED, so it must not also play its own
       arrival. Set here and never removed: it is true for this load. */
    document.body.className += ' no-entrance';
    document.getElementById('xfade').className = 'xfade is-on is-in no-anim';
  } catch (e) { /* private mode, blocked storage: just arrive normally */ }
}());
</script>

<!-- THE MARK BUILDS ITSELF — phase 1, and phase 1 is all this page
     does: the screen goes black and we hand over. Everything else
     happens on the project page, under a black layer it paints before
     its own first frame.

     THE HAND-OVER IS ON PURE BLACK ON PURPOSE. Two documents can never
     be composited, so a hand-over always shows one frame of each; a
     frame of nothing is the only seam that cannot be seen. An earlier
     version handed over on the finished wordmark and read as two
     transitions stitched together. -->
<div class="markbuild" id="markbuild" aria-hidden="true"></div>

<div class="shell">

      <p class="pick-lede" data-in="4" data-t="Moray is open. Building and unit selection, the offer and the WhatsApp post follow here as its sales material arrives.">Moray is open. Building and unit selection, the offer
        and the WhatsApp post follow here as its sales material arrives.</p>
    </section>

    </footer>

  </main>

</div>
