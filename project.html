<!-- THE MARK BUILDS ITSELF — phases 2 to 7. See js/markbuild.js.

     IT IS FIRST IN THE BODY, AND THE SCRIPT BELOW IT IS INLINE AND
     SYNCHRONOUS, ON PURPOSE. The page we came from ended on a black
     screen, and this page has to be black before anything of its own
     reaches the glass. One frame of the project showing through is the
     seam the whole design exists to avoid.

     The lockup is empty here: its pieces are cut from the project's
     own logo, so markbuild.js builds them once config has loaded. -->
<div class="markbuild" id="markbuild" aria-hidden="true">
  <div class="mb-lock"></div>
</div>
<script>
/* Did we arrive through the transition? The key is read once and
   removed, and anything older than eight seconds is ignored, so a
   stale flag can never black out a page somebody opened on its own.
   Eight, because this page may have taken a moment to load and the
   black is covering exactly that. */
(function () {
  try {
    var raw = sessionStorage.getItem('mm.mark');
    sessionStorage.removeItem('mm.mark');
    if (!raw) return;
    var m = JSON.parse(raw);
    if (!m || !m.t || (Date.now() - Number(m.t)) >= 8000) return;
    document.getElementById('markbuild').className = 'markbuild is-on is-lit';
  } catch (e) { /* private mode, blocked storage: just arrive normally */ }
}());
</script>

<div class="shell">

  <header class="top">

    <div class="who" id="who"></div>
    <!-- the steps sit inside the header card, under a hairline (build 65) -->
